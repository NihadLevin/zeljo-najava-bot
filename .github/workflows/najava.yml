# One workflow for everything: match result, match preview and Meridian odds.
# Triggered from cron-job.org (workflow_dispatch through the GitHub API) – no GitHub schedule.
# A cron-job.org call without inputs uses rucno = "auto", which does everything by the rules:
#   result (once, after the match) -> preview (once per match, from 08:00 the morning after) -> odds
name: Najava utakmice

on:
  workflow_dispatch:
    inputs:
      rucno:
        description: "Šta pokrenuti (auto = sve po pravilima, kao cron job)"
        type: choice
        options: [auto, najava, rezultat, oboje, kvote]
        default: auto
      prisilno:
        description: "Objavi ponovo i ako je već objavljeno (kod kvota: cijela lista)"
        type: boolean
        default: false

permissions:
  contents: write            # so it can save zadnja_najava.json and kvote_stanje.json

concurrency:
  group: najava
  cancel-in-progress: false

jobs:
  najava:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUCNO: ${{ inputs.rucno || 'auto' }}
    steps:
      # latest commit of the branch, so a queued run sees what was just posted
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Objavi rezultat / najavu
        if: env.RUCNO != 'kvote'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_NAJAVA_WEBHOOK }}
          PRISILNO: ${{ inputs.prisilno }}
        run: python najava_bot.py

      # odds on every normal run and on manual "kvote"
      - name: Instaliraj Playwright
        if: env.RUCNO == 'auto' || env.RUCNO == 'kvote'
        run: |
          pip install -q playwright
          # GitHub runners already have Google Chrome; download Chromium only if it's missing
          command -v google-chrome >/dev/null || python -m playwright install --with-deps chromium

      - name: Provjeri kvote
        if: env.RUCNO == 'auto' || env.RUCNO == 'kvote'
        continue-on-error: true      # Meridian down must not block saving the preview/result
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_KVOTE_WEBHOOK || secrets.DISCORD_NAJAVA_WEBHOOK }}
          OBJAVI_SVE: ${{ inputs.prisilno }}
        run: python kvote_bot.py

      # if Meridian didn't load, a screenshot of what the bot saw is attached to the run
      - uses: actions/upload-artifact@v4
        if: hashFiles('meridian_debug.png') != ''
        with:
          name: meridian-screenshot
          path: meridian_debug.png
          retention-days: 3

      - name: Sačuvaj šta je objavljeno
        if: always()
        run: |
          git config user.name "najava-bot"
          git config user.email "najava-bot@users.noreply.github.com"
          for f in zadnja_najava.json kvote_stanje.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "Objava"
          # retry so the "already posted" record is never lost (avoids duplicate posts)
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
