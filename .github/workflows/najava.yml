# Put this file in the repo at: .github/workflows/najava.yml
# One workflow for everything: match preview, result and Meridian odds.
name: Najava utakmice

on:
  schedule:
    # Morning – preview. GitHub uses UTC and is often late, so the bot starts
    # ~25 min early and waits until exactly 08:00 itself; later runs are backups.
    # Winter (UTC+1): 06:35 too early · 07:35 waits until 08:00 · 08:15–10:15 backups
    # Summer (UTC+2): 07:35 waits until 08:00 · 08:35–11:15 backups
    - cron: "35 5 * * *"
    - cron: "35 6 * * *"
    - cron: "15 7-9 * * *"          # + odds check
    # Afternoon/evening – result every 20 min, 12:00–22:40 UTC
    # (winter 13:00–23:40, summer 14:00–00:40 Sarajevo time).
    - cron: "0 12-22 * * *"         # + odds check (once an hour)
    - cron: "20,40 12-22 * * *"
    # Each run exits in seconds if there's nothing new to post.
  workflow_dispatch:         # manual run = post immediately (for testing)
    inputs:
      rucno:
        description: "Šta objaviti"
        type: choice
        options: [najava, rezultat, oboje, kvote]
        default: najava
      prisilno:
        description: "Objavi ponovo i ako je već objavljeno (kod kvota: cijela lista)"
        type: boolean
        default: false

permissions:
  contents: write            # so it can save zadnja_najava.json and kvote_stanje.json

concurrency:
  group: najava
  cancel-in-progress: false

jobs:
  najava:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # check out the LATEST commit of the branch, not the one from when the run
      # was scheduled – otherwise a queued run could miss what was just posted
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Objavi rezultat / najavu
        if: inputs.rucno != 'kvote'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_NAJAVA_WEBHOOK }}
          RUCNO: ${{ inputs.rucno }}
          PRISILNO: ${{ inputs.prisilno }}
        run: python najava_bot.py

      # odds only on the hourly runs (and manual "kvote") – installing Chrome takes ~1 min
      - name: Treba li provjeriti kvote?
        id: kv
        run: |
          if [ "${{ inputs.rucno }}" = "kvote" ] \
             || [ "${{ github.event.schedule }}" = "0 12-22 * * *" ] \
             || [ "${{ github.event.schedule }}" = "15 7-9 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        if: steps.kv.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Instaliraj Playwright
        if: steps.kv.outputs.run == 'true'
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Provjeri kvote
        if: steps.kv.outputs.run == 'true'
        continue-on-error: true      # Meridian down must not block saving the preview/result
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_KVOTE_WEBHOOK || secrets.DISCORD_NAJAVA_WEBHOOK }}
          OBJAVI_SVE: ${{ inputs.prisilno }}
        run: python kvote_bot.py

      - name: Sačuvaj šta je objavljeno
        if: always()
        run: |
          git config user.name "najava-bot"
          git config user.email "najava-bot@users.noreply.github.com"
          for f in zadnja_najava.json kvote_stanje.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "Objava"
          # retry so the "already posted" record is never lost (avoids duplicate posts)
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
